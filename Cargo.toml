[workspace]
members = [
    "crates/servoloop-core",
    "crates/servoloop-robot",
    "examples/simulated-arm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/unravelaidk/servoloop"
rust-version = "1.80"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
