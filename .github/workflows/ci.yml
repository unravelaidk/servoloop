name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Rust format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  docs:
    name: Rust documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps --locked
      - run: cargo test --workspace --doc --locked

  msrv:
    name: Minimum Rust 1.88
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --workspace --all-targets --locked

  example-smoke:
    name: Deterministic example smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -p servoloop-simulated-arm > example-output.jsonl
          grep -F '"type":"run_completed"' example-output.jsonl
          grep -F '"session_id":"simulated-arm-demo"' example-output.jsonl
          grep -F 'The simulated shoulder moved to 0.2 radians.' example-output.jsonl

  terminal-smoke:
    name: Interactive terminal smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: cargo build -p servoloop-cli --locked
      - run: python3 scripts/test-terminal-ui.py target/debug/servoloop --artifacts terminal-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-evidence
          path: terminal-evidence/
          if-no-files-found: ignore

  python-bridge:
    name: Isaac bridge protocol tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s adapters/isaac-sim -p 'test_bridge.py' -v
